name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-for-ci-only-32chars!' }}
          ADMIN_API_KEY: "test-admin-key"
          DATABASE_SSL: "false"
        run: |
          cd api
          pytest tests/ -v --tb=short

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v1
        with:
          working-directory: api
          args: "check ."

      - name: Build Docker image
        run: |
          docker build -f server/compose/Dockerfile.api -t hauzral/api:${{ github.sha }} .

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Build and push
        run: |
          docker build -f server/compose/Dockerfile.api -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/hauzral-api:${{ github.sha }} .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/hauzral-api:${{ github.sha }}

      - name: Update EKS deployment
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hauzral-cluster
          kubectl set image deployment/hauzral-api api=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/hauzral-api:${{ github.sha }} -n hauzral
          kubectl rollout status deployment/hauzral-api -n hauzral --timeout=300s
