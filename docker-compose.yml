version: '3.9'

services:
  gateway:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && node apps/gateway/server.js"
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      NODE_ENV: development
    depends_on:
      - auth
      - education
      - finance
      - healthcare
      - logistics
      - commerce
      - governance
    restart: unless-stopped

  auth:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && node apps/auth/server.js"
    volumes:
      - .:/app
    ports:
      - "4010:4010"
    environment:
      PORT: 4010
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      NODE_ENV: development
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && node apps/dashboard/server.js"
    volumes:
      - .:/app
    ports:
      - "4173:4173"
    environment:
      PORT: 4173
      NODE_ENV: development
    depends_on:
      - gateway
    restart: unless-stopped

  education:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4001 node apps/education/server.js"
    volumes:
      - .:/app
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
    restart: unless-stopped

  finance:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4002 node apps/finance/server.js"
    volumes:
      - .:/app
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
    restart: unless-stopped

  healthcare:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4003 node apps/healthcare/server.js"
    volumes:
      - .:/app
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
    restart: unless-stopped

  logistics:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4004 node apps/logistics/server.js"
    volumes:
      - .:/app
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
    restart: unless-stopped

  commerce:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4005 node apps/commerce/server.js"
    volumes:
      - .:/app
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
    restart: unless-stopped

  governance:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && PORT=4006 node apps/governance/server.js"
    volumes:
      - .:/app
    ports:
      - "4006:4006"
    environment:
      PORT: 4006
    restart: unless-stopped
