apiVersion: v1
kind: Secret
metadata:
  name: hauzral-secrets
  namespace: hauzral
type: Opaque
stringData:
  database-url: "postgres://hauzral:${POSTGRES_PASSWORD}@postgres:5432/hauzral"
  admin-api-key: "${ADMIN_API_KEY}"
  jwt-secret: "${JWT_SECRET}"
  openai-api-key: "${OPENAI_API_KEY}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hauzral-config
  namespace: hauzral
data:
  app-name: "Hauzral Technologies API"
  app-version: "2.0.0"
  environment: "production"
  log-level: "INFO"
  database-pool-size: "10"
  database-max-overflow: "20"
  access-token-expire-minutes: "30"
  refresh-token-expire-days: "7"
  rate-limit-per-minute: "60"
  cors-origins: '["https://hauzral.com","https://app.hauzral.com"]'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hauzral-api.fullname" . }}
  namespace: hauzral
  labels:
    {{- include "hauzral-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hauzral-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hauzral-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      serviceAccountName: {{ include "hauzral-api.fullname" . }}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hauzral-config
                  key: environment
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hauzral-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hauzral-secrets
                  key: admin-api-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hauzral-secrets
                  key: jwt-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hauzral-api.fullname" . }}
  namespace: hauzral
  labels:
    {{- include "hauzral-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "hauzral-api.selectorLabels" . | nindent 4 }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hauzral-api.fullname" . }}
  namespace: hauzral
  labels:
    {{- include "hauzral-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hauzral-api.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hauzral-api.fullname" . }}
  namespace: hauzral
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hauzral-api.fullname" . }}-sa
  namespace: hauzral
