apiVersion: v1
kind: Secret
metadata:
  name: hauzral-secrets
  namespace: hauzral
type: Opaque
stringData:
  database-url: "postgres://hauzral:${POSTGRES_PASSWORD}@postgres:5432/hauzral"
  redis-url: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  admin-api-key: "${ADMIN_API_KEY}"
  jwt-secret: "${JWT_SECRET}"
  openai-api-key: "${OPENAI_API_KEY}"
  smtp-user: "${SMTP_USER}"
  smtp-password: "${SMTP_PASSWORD}"
