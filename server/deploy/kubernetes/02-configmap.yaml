apiVersion: v1
kind: ConfigMap
metadata:
  name: hauzral-config
  namespace: hauzral
data:
  app-name: "Hauzral Technologies API"
  app-version: "2.0.0"
  environment: "production"
  log-level: "INFO"
  database-pool-size: "10"
  database-max-overflow: "20"
  access-token-expire-minutes: "30"
  refresh-token-expire-days: "7"
  rate-limit-per-minute: "60"
  rate-limit-window-seconds: "60"
  email-provider: "smtp"
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  cors-origins: '["https://hauzral.com","https://api.hauzral.com"]'
  allowed-hosts: '["hauzral.com","api.hauzral.com"]'
