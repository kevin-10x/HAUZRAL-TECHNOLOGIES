apiVersion: apps/v1
kind: Deployment
metadata:
  name: hauzral-worker
  namespace: hauzral
  labels:
    app: hauzral-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hauzral-worker
  template:
    metadata:
      labels:
        app: hauzral-worker
    spec:
      serviceAccountName: hauzral-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: celery
          image: hauzral/worker:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.services.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: hauzral-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hauzral-secrets
                  key: database-url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hauzral-beat
  namespace: hauzral
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: celery-beat
              image: hauzral/worker:2.0.0
              imagePullPolicy: IfNotPresent
              command: ["celery", "-A", "app.services.tasks.celery_app", "beat", "--loglevel=INFO"]
              env:
                - name: CELERY_BROKER_URL
                  valueFrom:
                    secretKeyRef:
                      name: hauzral-secrets
                      key: redis-url
          restartPolicy: OnFailure
